# /etc/nginx/sites-available/roblowe.gordulic.sk
# Len HTTP – certbot --nginx tento súbor prepíše na HTTPS (pridá 443 server + redirect na porte 80).
# NIKDY nedávaj `return 301 https://...` do 443 bloku (nekonečné presmerovanie).
server {
    server_name roblowe.gordulic.sk;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # login rate limiter číta POSLEDNÝ hop X-Forwarded-For – nechaj $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
}
