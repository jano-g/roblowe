<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ app_name }} – prihlásenie</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ v }}">
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand"><img src="/static/img/icon.svg" alt="" width="40" height="40"><h1>{{ app_name }}</h1></div>
  <p class="muted">Obchodný agent · režim <strong class="mode mode-{{ mode }}">{{ mode }}</strong></p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Meno<input name="username" autocomplete="username" required autofocus></label>
    <label>Heslo<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Prihlásiť</button>
  </form>
</main>
</body>
</html>
